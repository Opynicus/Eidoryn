[package]
name = "eidoryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Eidoryn — a PlayStation emulator with a native GPUI interface"
license = "GPL-3.0-only"

[lib]
name = "eidoryn_psx"

[workspace]
members = ["crates/ps1", "crates/host", "crates/jit-runtime"]
default-members = ["."]
resolver = "3"

[features]
default = ["desktop", "wayland", "x11", "hardware", "jit"]
desktop = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:serde", "dep:serde_json", "eidoryn-host/audio-output", "eidoryn-host/themes"]
wayland = ["desktop", "gpui_platform/wayland"]
x11 = ["desktop", "gpui_platform/x11"]
vulkan = ["eidoryn-ps1/vulkan"]
opengl = ["eidoryn-ps1/opengl"]
dx12 = ["eidoryn-ps1/dx12"]
metal = ["eidoryn-ps1/metal"]
hardware = ["dx12", "metal", "vulkan", "opengl"]
jit = ["eidoryn-ps1/jit"]
# Opt-in GPUI interaction tests; headless builds keep their minimal dependencies.
ui-tests = ["desktop", "gpui/test-support"]

[dependencies]
eidoryn-ps1 = { path = "crates/ps1", default-features = false }
eidoryn-host = { path = "crates/host", default-features = false }
# Follow official main; Cargo.lock pins the exact tested revision for both crates.
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", version = "0.2.2", default-features = false, optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", version = "0.1.0", default-features = false, features = ["font-kit"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[patch.crates-io]
# Match Zed main's task-waker fix until it is released on crates.io.
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
# GPUI's Linux event-loop and EGL fixes from the same upstream workspace.
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Emulator bit patterns deliberately cross signed/unsigned and byte boundaries.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Hardware register masks are clearer than host bit-counting idioms.
verbose_bit_mask = "allow"
