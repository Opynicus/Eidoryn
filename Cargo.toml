[package]
name = "eidoryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Eidoryn — a PlayStation emulator with a native GPUI interface"
license = "GPL-3.0-only"

[lib]
name = "eidoryn_psx"

[workspace]
members = ["crates/jit-runtime"]
default-members = ["."]
resolver = "3"

[features]
default = ["desktop", "vulkan", "jit"]
desktop = ["dep:gpui", "dep:image", "dep:libc", "dep:serde", "dep:serde_json", "dep:cpal"]
vulkan = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
jit = ["dep:eidoryn-jit-runtime"]

[dependencies]
eidoryn-jit-runtime = { path = "crates/jit-runtime", optional = true }
gpui = { version = "=0.2.2", optional = true }
image = { version = "0.25", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
cpal = { version = "=0.16.0", optional = true }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"], optional = true }
pollster = { version = "=0.4.0", optional = true }
bytemuck = { version = "=1.25.2", optional = true }

# GPUI's old xattr dependency still requires the ENOATTR alias on Linux.
libc = { version = "=0.2.186", optional = true }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Emulator bit patterns deliberately cross signed/unsigned and byte boundaries.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Hardware register masks are clearer than host bit-counting idioms.
verbose_bit_mask = "allow"
