[package]
name = "eidoryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Eidoryn — a PlayStation emulator with a native GPUI interface"
license = "GPL-3.0-only"

[lib]
name = "eidoryn_psx"

[workspace]
members = ["crates/ps1", "crates/host", "crates/jit-runtime"]
default-members = ["."]
resolver = "3"

[features]
default = ["desktop", "vulkan", "jit"]
desktop = ["dep:gpui", "dep:image", "dep:libc", "eidoryn-host/audio-output", "eidoryn-host/themes"]
vulkan = ["eidoryn-ps1/vulkan"]
jit = ["eidoryn-ps1/jit"]

[dependencies]
eidoryn-ps1 = { path = "crates/ps1", default-features = false }
eidoryn-host = { path = "crates/host", default-features = false }
gpui = { version = "=0.2.2", optional = true }
image = { version = "0.25", default-features = false, optional = true }

# GPUI's old xattr dependency still requires the ENOATTR alias on Linux.
libc = { version = "=0.2.186", optional = true }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Emulator bit patterns deliberately cross signed/unsigned and byte boundaries.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Hardware register masks are clearer than host bit-counting idioms.
verbose_bit_mask = "allow"
