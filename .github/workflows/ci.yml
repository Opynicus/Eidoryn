name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package format tests
        run: python3 -m unittest discover -s scripts -p test_package_release.py -v
      - name: Rust
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - name: Cache Cargo downloads
        id: registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch dependencies
        if: steps.registry.outputs.cache-hit != 'true'
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu
  test:
    name: Linux x86_64 ${{ matrix.backend }}
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland, x11]
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt && rustup default 1.100.0
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev libxcb-cursor-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - name: Restore Cargo downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.backend }}-test
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked --workspace --exclude gpui --no-default-features --features ${{ matrix.backend }},vulkan,jit,ui-tests
  windows:
    name: Windows x86_64 MSVC
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Package format tests
        run: python -m unittest discover -s scripts -p test_package_release.py -v
      - name: Rust
        shell: bash
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt && rustup default 1.100.0
      - name: Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object { [version] $_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "Windows SDK fxc.exe was not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-test
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked --workspace --exclude gpui --no-default-features --features desktop,dx12,vulkan,opengl,ui-tests
      - name: Native Windows file-drop regression
        run: cargo test --locked -p gpui --lib --no-default-features --features font-kit,windows-manifest,test-support file_drop_tests -- --test-threads=1
