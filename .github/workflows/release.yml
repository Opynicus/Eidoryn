name: Linux Desktop Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: Linux x86_64 ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland, x11]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt && rustup default 1.98.1
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev libxcb-cursor-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked --release --workspace --no-default-features --features ${{ matrix.backend }},vulkan,jit
      - name: Build
        run: cargo build --locked --release --bin eidoryn --no-default-features --features ${{ matrix.backend }},vulkan,jit
      - name: Original demo smoke test
        run: ./target/release/eidoryn --headless --no-memory-cards --frames 120
      - name: Package
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: python3 scripts/package_release.py --label "${PACKAGE_VERSION}-linux-x86_64-${{ matrix.backend }}" --binary target/release/eidoryn
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ matrix.backend }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-x86_64-*
          path: dist
          merge-multiple: true
      - name: Publish Wayland and X11 packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          files=()
          for backend in wayland x11; do
            archive="Eidoryn-${RELEASE_TAG}-linux-x86_64-${backend}.tar.gz"
            sha256sum --check --strict "${archive}.sha256"
            files+=("$archive" "${archive}.sha256")
          done
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Experimental project developed with extensive AI assistance. Hardware accuracy and game compatibility are still under active development.

          Experimental, unsigned Linux x86-64 desktop packages. Choose the Wayland archive for a Wayland session, or the X11 archive for an X11 session. Each build enables only its named GPUI window backend. Requires Ubuntu 24.04 or a compatible newer glibc and the corresponding Wayland/XCB, xkbcommon, fontconfig, FreeType and ALSA runtime libraries.

          Both variants must pass tests, the release build and the original headless demo smoke test before publishing. SHA-256 sidecars accompany both archives. Vulkan rendering requires a supported physical GPU and driver; software rendering remains the default. JIT is optional at runtime. No BIOS, games, saves or gameplay test artifacts are distributed.

          Windows, macOS and standalone CLI packages are not published by this workflow. Automated headless checks do not verify desktop gameplay or full game compatibility.
          NOTES
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "Eidoryn $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
