name: Desktop Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    name: Linux x86_64 ${{ matrix.backend }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland, x11]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev libxcb-cursor-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - name: Restore Cargo downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.backend }}-release
      - name: Build
        run: cargo build --locked --release --bin eidoryn --no-default-features --features ${{ matrix.backend }},vulkan,jit
      - name: Original demo smoke test
        run: ./target/release/eidoryn --headless --no-memory-cards --frames 120
      - name: Package
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: python3 scripts/package_release.py --label "${PACKAGE_VERSION}-linux-x86_64-${{ matrix.backend }}" --binary target/release/eidoryn
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ matrix.backend }}
          path: dist/*
          if-no-files-found: error
  windows:
    name: Windows x86_64 MSVC
    needs: ci
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - name: Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object { [version] $_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "Windows SDK fxc.exe was not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-release
      - name: Build
        run: cargo build --locked --release --bin eidoryn --no-default-features --features desktop,dx12,vulkan,opengl
      - name: Original demo smoke test
        # A pipeline makes PowerShell wait for the Windows GUI executable.
        run: |
          ./target/release/eidoryn.exe --headless --no-memory-cards --frames 120 | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: python scripts/package_release.py --label "${env:PACKAGE_VERSION}-windows-x86_64" --binary target/release/eidoryn.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-x86_64-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - name: Publish Wayland, X11 and Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          files=()
          for suffix in linux-x86_64-wayland.tar.gz linux-x86_64-x11.tar.gz windows-x86_64.zip; do
            archive="Eidoryn-${RELEASE_TAG}-${suffix}"
            test -f "$archive"
            sha256sum --check --strict "${archive}.sha256"
            files+=("$archive" "${archive}.sha256")
          done
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Desktop compatibility prerelease with fixes for CD-ROM read stalls and DMA transfers. This is a branch prerelease and is not marked as the latest release.

          Experimental project developed with extensive AI assistance. Hardware accuracy and game compatibility are still under active development.

          Restarted CD-ROM reads now discard stale staged sectors while preserving accepted data. CD-ROM chopping observes CPU windows, valid long GPU DMA lists are accepted, and cyclic lists remain busy until software aborts them. The current Midnight desktop interface is included.

          Runtime archives contain only the executable and the Ember theme JSON. Icons and shaders are embedded in the executable; documentation and other development files are not bundled.

          The fixes were tested locally with an SCPH-5501 BIOS: Tekken 3 completed 2.399 billion emulation steps and reached gameplay; Crash Bandicoot passed a 1.5-billion-step menu/attract-mode run and a separate manual run into N. Sanity Beach. This covers the reported failures, not full game compatibility.

          Experimental, unsigned Linux x86-64 desktop packages. Choose the Wayland archive for a Wayland session, or the X11 archive for an X11 session. Each build enables only its named GPUI window backend. Requires Ubuntu 24.04 or a compatible newer glibc and the corresponding Wayland/XCB, xkbcommon, fontconfig, FreeType and ALSA runtime libraries.

          The experimental, unsigned Windows x86-64 ZIP is built natively with MSVC and includes the desktop interface. Extract the complete archive and run eidoryn.exe from its directory. Windows desktop gameplay, input and audio have not been manually validated; the automated Windows check runs the original headless demo. JIT is available only in the Linux builds.

          All three variants must pass tests, the release build and the original headless demo smoke test before publishing. SHA-256 sidecars accompany all archives. Vulkan rendering requires a supported physical GPU and driver; software rendering remains the default. No BIOS, games, saves or gameplay test artifacts are distributed.

          macOS and standalone CLI packages are not published by this workflow. Automated headless checks do not verify desktop gameplay or full game compatibility.
          NOTES
          printf '\nSource, licenses and third-party notices: https://github.com/%s/tree/%s\n' "$GH_REPO" "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --target "$RELEASE_COMMIT" --title "Eidoryn $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
