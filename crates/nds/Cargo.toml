[package]
name = "eidoryn-nds"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Nintendo DS core with built-in BIOS services for Eidoryn"

[dependencies]
eidoryn-arm = { path = "../arm" }
bincode = "1.3.3"
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"

[lints]
workspace = true
