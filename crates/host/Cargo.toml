[package]
name = "eidoryn-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "System-independent audio transport, CRT filters and themes for Eidoryn"

[features]
default = []
graphics = ["dep:wgpu-types"]
audio-output = ["dep:cpal"]
themes = ["dep:serde", "dep:serde_json"]

[dependencies]
wgpu-types = { version = "=30.0.2", default-features = false, optional = true }
cpal = { version = "=0.18.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[lints]
workspace = true
