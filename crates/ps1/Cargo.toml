[package]
name = "eidoryn-ps1"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Independent PlayStation hardware core for Eidoryn"

[features]
default = []
vulkan = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
jit = ["dep:eidoryn-jit-runtime"]

[dependencies]
smallvec = { version = "=1.16.4", features = ["union"] }
eidoryn-jit-runtime = { path = "../jit-runtime", optional = true }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"], optional = true }
pollster = { version = "=0.4.0", optional = true }
bytemuck = { version = "=1.25.2", optional = true }

[lints]
workspace = true
